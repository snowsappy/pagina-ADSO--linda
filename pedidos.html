<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./codigo css/pedidos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/dist/tabler-icons.min.css">
</head>

<body>
    <header>
        <div class="navBar">

            <div class="menu">
                <button class="hamburguesa">☰</button>
                <nav>
                    <ul>
                        <li><a href="indeex.html">
                                <p>productos</p>
                            </a></li>
                        <li><a href="sobrenostros.html">
                                <p>nosotros</p>
                            </a></li>
                        <li><a href="">
                                <p>preferencial</p>
                            </a></li>
                    </ul>
                </nav>
            </div>
            <div class="logo">
                <img src="./images/lindaa.png" alt="logo">
            </div>
            <div class="iconos">
                <a href="carrito.html"><img src="./images/carritocompra.png" alt="carrito"></a>
                <a href="perfil.html"><img src="./images/usuario temporal.png" alt="usuario"></a>
            </div>
        </div>
    </header>
    <main class="main">

        <div class="pedidos-title">
            <h2>Mis pedidos</h2>
            <h4>productos/Mis pedidos</h4>
        </div>

        <!-- TABS -->
        <div class="pedidos-tabs">
            <button class="tab-btn active">Todos</button>
            <button class="tab-btn">Enviados</button>
            <button class="tab-btn">Recibidos</button>
        </div>

        <!-- TRACKER DE ESTADO -->
        <div class="pedido-tracker">
            <div class="tracker-step activo">
                <div class="tracker-circulo">
                    <i class="ti ti-clipboard-list"></i>
                </div>
            </div>
            <div class="tracker-linea solida"></div>
            <div class="tracker-step activo">
                <div class="tracker-circulo">
                    <i class="ti ti-package"></i>
                </div>
            </div>
            <div class="tracker-linea solida"></div>
            <div class="tracker-step activo">
                <div class="tracker-circulo">
                    <i class="ti ti-truck-delivery"></i>
                </div>
            </div>
            <div class="tracker-linea punteada"></div>
            <div class="tracker-step pendiente">
                <div class="tracker-circulo">
                    <i class="ti ti-home"></i>
                </div>
            </div>
        </div>

        <!-- TARJETA DE PEDIDO -->
        <div class="pedido-card">
            <div class="pedido-card-header">
                <div class="pedido-id">
                    <span>id 54355#</span>
                    <span>fecha 13/20/2060</span>
                </div>
                <div class="pedido-estado">
                    <span>enviado</span>
                    <span>Bogota, Colombia</span>
                </div>
            </div>

            <div class="pedido-card-body">
                <img src="./images/Rounded rectangle.jpg" alt="producto">
                <div class="pedido-info">
                    <p class="pedido-nombre">llaveros de mi vecino el estudio gibli</p>
                    <p class="pedido-precio">precio 70000$ <span>x1</span></p>
                </div>
                <div class="pedido-fecha-recibir">
                    <span>fecha a recibir</span>
                    <span>23/30/2070</span>
                </div>
            </div>

            <div class="pedido-card-footer">
                <span class="pedido-total">Total 70000$ <span class="pedido-articulos">(1 artículos)</span></span>
                <button class="btn-detalles">Detalles</button>
            </div>

        </div>

    </main>
    <footer>
        <div class="pie">
            <div class="lado-izquierdo">
                <img src="./images/wp.png" alt="instagram">
                <p>344544545</p>
            </div>
            <div class="logo-footer">
                <img src="./images/logo-footer.png" alt="logo">
            </div>
            <div class="image-footer">
                <ul>
                    <li><img src="./images/instagram.png" alt="f"></li>
                    <li><img src="./images/fb.png" alt="fb"></li>
                    <li><img src="./images/yt.png" alt="yt"></li>
                    <li><img src="./images/x.png" alt="x"></li>
                </ul>
            </div>
        </div>
    </footer>
</body>

</html>
